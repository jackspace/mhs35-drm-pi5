# MHS-3.5inch resistive touch (ADS7846) on the evdev X driver, panel rotated 90.
# libinput only hovered (resistive jitter cancels GTK clicks); evdev de-jitters and takes raw calibration.
# Measured raw ranges: X 242..3790 (bottom edge 3807 at normal pressure), Y 182..3943. SwapAxes + inverted Y range.
Section "InputClass"
        Identifier      "mhs35 touch (evdev)"
        MatchProduct    "ADS7846 Touchscreen"
        MatchDevicePath "/dev/input/event*"
        Driver          "evdev"
        Option  "Calibration"   "242 3790 3943 182"
        Option  "SwapAxes"      "1"
        Option  "EmulateThirdButton" "1"
        Option  "EmulateThirdButtonTimeout" "1000"
        Option  "EmulateThirdButtonMoveThreshold" "300"
EndSection
