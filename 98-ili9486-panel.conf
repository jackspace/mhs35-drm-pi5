# MHS35 panel on the DRM ili9486 driver is an X GPU screen (reverse PRIME sink).
# With glamor on the sink, modesetting uses the vblank-driven offload copy; the SPI panel has no vblank, so the
# panel froze on its first frame. AccelMethod none selects the DirtyFB copy path, which pushes every damage rect over SPI.
Section "OutputClass"
  Identifier "ili9486 spi panel"
  MatchDriver "ili9486"
  Driver "modesetting"
  Option "AccelMethod" "none"
  # PageFlip off -> randr cannot use shared-pixmap flipping (vblank-driven; SPI has no vblank),
  # falls back to single shared pixmap + dirty tracking + DIRTYFB copies.
  Option "PageFlip" "false"
  # no cursor plane on the SPI pipe; draw the cursor into the framebuffer so it reaches the panel.
  Option "SWCursor" "true"
EndSection
